name: YouTube repeat offender report

on:
  workflow_dispatch:
    inputs:
      min_comments:
        description: Candidate threshold by negative-comment count
        required: false
        default: '3'
      min_videos:
        description: Candidate threshold by distinct video count
        required: false
        default: '2'
      notify_slack:
        description: Post the candidate report to Slack
        required: false
        type: boolean
        default: true
  schedule:
    # 매일 18:23 KST. 정각 크론 지연 구간을 피하고, 후보가 있을 때만 Slack에 보낸다.
    - cron: '23 9 * * *'

concurrency:
  group: youtube-repeat-offender-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: npm install --ignore-scripts
      - name: Build owned-channel repeat-offender report
        run: npm run report:youtube-repeat-offenders
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID }}
          SLACK_ROUTING_EFFECTIVE_DATE_KST: ${{ vars.SLACK_ROUTING_EFFECTIVE_DATE_KST }}
          SLACK_ASSIGNEE_OTHER: ${{ vars.SLACK_ASSIGNEE_OTHER }}
          SLACK_ASSIGNEE_JD_PRIMARY: ${{ vars.SLACK_ASSIGNEE_JD_PRIMARY }}
          SLACK_ASSIGNEE_AWARENESS: ${{ vars.SLACK_ASSIGNEE_AWARENESS }}
          SLACK_ASSIGNEE_AWARENESS_NEXT: ${{ vars.SLACK_ASSIGNEE_AWARENESS_NEXT }}
          SLACK_ASSIGNEE_P_AWARENESS: ${{ vars.SLACK_ASSIGNEE_P_AWARENESS }}
          SLACK_ASSIGNEE_JG_PRIMARY: ${{ vars.SLACK_ASSIGNEE_JG_PRIMARY }}
          SLACK_ASSIGNEE_JG_ADDITIONAL: ${{ vars.SLACK_ASSIGNEE_JG_ADDITIONAL }}
          YOUTUBE_REPEAT_OFFENDER_MIN_COMMENTS: ${{ github.event_name == 'workflow_dispatch' && inputs.min_comments || '3' }}
          YOUTUBE_REPEAT_OFFENDER_MIN_VIDEOS: ${{ github.event_name == 'workflow_dispatch' && inputs.min_videos || '2' }}
          YOUTUBE_REPEAT_OFFENDER_NOTIFY_SLACK: ${{ github.event_name == 'schedule' && 'true' || inputs.notify_slack && 'true' || 'false' }}
