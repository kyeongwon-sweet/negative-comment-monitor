name: False positive audit

on:
  workflow_dispatch:
    inputs:
      lookback_days:
        description: Days of [무시]/false-positive feedback to summarize
        required: false
        default: '7'
      min_count:
        description: Minimum false positives before posting to Slack
        required: false
        default: '5'
      notify_slack:
        description: Post the audit to Slack
        required: false
        type: boolean
        default: true
  schedule:
    # 매주 월 10:23 KST(01:23 UTC). 정각(UTC0=KST9) 대량 드롭 구간을 피하고,
    # [무시] 누적이 임계 이상일 때만 Slack에 프롬프트 튜닝 신호를 보낸다.
    - cron: '23 1 * * 1'

concurrency:
  group: false-positive-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: npm install --ignore-scripts
      - name: Summarize classifier false positives ([무시] 피드백)
        run: npm run audit:false-positive
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID }}
          SLACK_ASSIGNEE_AWARENESS: ${{ vars.SLACK_ASSIGNEE_AWARENESS }}
          FALSE_POSITIVE_AUDIT_LOOKBACK_DAYS: ${{ github.event_name == 'workflow_dispatch' && inputs.lookback_days || '7' }}
          FALSE_POSITIVE_AUDIT_MIN_COUNT: ${{ github.event_name == 'workflow_dispatch' && inputs.min_count || '5' }}
          FALSE_POSITIVE_AUDIT_NOTIFY_SLACK: ${{ github.event_name == 'schedule' && 'true' || inputs.notify_slack && 'true' || 'false' }}
