name: YouTube owner channel monitor

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Collect/classify only; do not save, alert, or hide
        required: false
        type: boolean
        default: true
      force_video_ids:
        description: Comma-separated YouTube video IDs to deep scan now
        required: false
        type: string
      force_reclassify:
        description: Bypass classifier cache for forced videos (human false-positive decisions still win)
        required: false
        type: boolean
        default: false
  schedule:
    # 댓글 최초 감지 지연 상한을 약 3시간으로 유지. 댓글수 변화가 없는 영상은 본문 API를 호출하지 않는다.
    - cron: '17 */3 * * *'

concurrency:
  group: youtube-owner-channel-production
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: npm install --ignore-scripts
      - name: Verify owner-channel schema contract
        id: schema
        continue-on-error: true
        run: node src/youtube-owner-preflight.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Run owner-channel monitor
        id: owner_monitor
        if: ${{ steps.schema.outcome == 'success' }}
        continue-on-error: true
        run: npm run start:youtube-owner-channels
        env:
          LLM_PROVIDER: gemini
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.1-flash-lite
          # 무료 Gemini의 분당 호출 한도를 넘겨 마지막 분류 청크가 키워드로
          # 폴백하지 않도록 소유채널 전수 스캔은 보수적으로 12 RPM 이하로 제한한다.
          GEMINI_REQUEST_INTERVAL_MS: '5000'
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: claude-haiku-4-5-20251001
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_ASSIGNEE_OTHER: ${{ vars.SLACK_ASSIGNEE_OTHER }}
          SLACK_ASSIGNEE_JDBOK: ${{ vars.SLACK_ASSIGNEE_JDBOK }}
          SLACK_ASSIGNEE_SATELLITE: ${{ vars.SLACK_ASSIGNEE_SATELLITE }}
          SLACK_ASSIGNEE_JD_SATELLITE: ${{ vars.SLACK_ASSIGNEE_JD_SATELLITE }}
          YOUTUBE_OWNER_LOOKBACK_DAYS: '14'
          YOUTUBE_OWNER_MAX_UPLOAD_PAGES: '10'
          YOUTUBE_OWNER_MAX_THREAD_PAGES: '10'
          YOUTUBE_OWNER_MAX_REPLY_PAGES: '100'
          YOUTUBE_OWNER_QUICK_MAX_THREAD_PAGES: '2'
          YOUTUBE_OWNER_DEEP_MAX_THREAD_PAGES: '100'
          YOUTUBE_OWNER_HIGH_COMMENT_THRESHOLD: '200'
          YOUTUBE_OWNER_HIGH_COMMENT_RESCAN_HOURS: '24'
          YOUTUBE_OWNER_RISK_LOOKBACK_DAYS: '60'
          YOUTUBE_OWNER_RECENT_NEGATIVE_DAYS: '7'
          YOUTUBE_OWNER_RECENT_NEGATIVE_RESCAN_HOURS: '3'
          YOUTUBE_OWNER_HISTORICAL_NEGATIVE_THRESHOLD: '5'
          YOUTUBE_OWNER_HISTORICAL_NEGATIVE_RESCAN_HOURS: '24'
          YOUTUBE_OWNER_OVERLOAD_NEGATIVE_COUNT: '20'
          YOUTUBE_OWNER_OVERLOAD_RATIO_PERCENT: '40'
          YOUTUBE_OWNER_OVERLOAD_MIN_COMMENTS: '10'
          YOUTUBE_OWNER_OVERLOAD_COOLDOWN_HOURS: '24'
          # OAuth 미연결 채널 커버리지 경고는 인증된 채널 수집을 막지 않고 주 1회 이하로만 알린다.
          YOUTUBE_OWNER_COVERAGE_ALERT_COOLDOWN_HOURS: '168'
          YOUTUBE_OWNER_FORCE_VIDEO_IDS: ${{ github.event_name == 'workflow_dispatch' && inputs.force_video_ids || '' }}
          YOUTUBE_OWNER_FORCE_RECLASSIFY: ${{ github.event_name == 'workflow_dispatch' && inputs.force_reclassify && 'true' || 'false' }}
          YOUTUBE_OWNER_ALERT_DELAY_MS: '1100'
          YOUTUBE_OWNER_DEFAULT_PRODUCT_NAME: JD
          YOUTUBE_OWNER_CHANNEL_AUTO_HIDE: 'true'
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
      - name: Sync new negative comments to Google Sheet
        if: ${{ always() }}
        continue-on-error: true
        run: npm run sync:negative-comment-sheet
        env:
          NEGATIVE_COMMENT_SHEET_WEBHOOK_URL: ${{ secrets.NEGATIVE_COMMENT_SHEET_WEBHOOK_URL }}
          NEGATIVE_COMMENT_SHEET_WEBHOOK_TOKEN: ${{ secrets.NEGATIVE_COMMENT_SHEET_WEBHOOK_TOKEN }}
          NEGATIVE_COMMENT_SHEET_FAILURE_THRESHOLD: '3'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_ASSIGNEE_OTHER: ${{ vars.SLACK_ASSIGNEE_OTHER }}
      - name: Notify Slack of auxiliary degraded state
        if: ${{ steps.schema.outcome == 'failure' || steps.owner_monitor.outcome == 'failure' }}
        continue-on-error: true
        run: node src/notify-auxiliary-degraded.js
        env:
          SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_ASSIGNEE_OTHER: ${{ vars.SLACK_ASSIGNEE_OTHER }}
          AUXILIARY_COMPONENT: YouTube 소유채널 보조 모니터
          AUXILIARY_REASON: schema=${{ steps.schema.outcome }}, monitor=${{ steps.owner_monitor.outcome }}
          FAILURE_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - name: Record auxiliary outcome
        if: ${{ always() }}
        run: |
          echo "### YouTube owner-channel auxiliary monitor" >> "$GITHUB_STEP_SUMMARY"
          echo "- schema: ${{ steps.schema.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- monitor: ${{ steps.owner_monitor.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- core monitor impact: none" >> "$GITHUB_STEP_SUMMARY"
