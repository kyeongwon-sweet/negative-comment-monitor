name: Pint awareness alert retag
run-name: Pint awareness alert retag (${{ inputs.apply && 'apply' || 'dry-run' }})

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Update existing Slack cards after the API-backed dry run
        required: true
        type: boolean
        default: false

concurrency:
  group: pint-awareness-alert-retag
  cancel-in-progress: false

jobs:
  retag:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: npm install --ignore-scripts
      - name: Identify Pint campaigns and retag matching awareness cards
        run: node src/pint-awareness-retag.js
        env:
          APPLY: ${{ inputs.apply }}
          SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_ASSIGNEE_OTHER: ${{ vars.SLACK_ASSIGNEE_OTHER }}
          SLACK_ASSIGNEE_AWARENESS: ${{ vars.SLACK_ASSIGNEE_AWARENESS }}
          SLACK_ASSIGNEE_P_SPONSORSHIP: ${{ vars.SLACK_ASSIGNEE_P_SPONSORSHIP }}
          SLACK_ASSIGNEE_P_VIRAL_VIDEO: ${{ vars.SLACK_ASSIGNEE_P_VIRAL_VIDEO }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          TIKTOK_ADVERTISER_ID: ${{ vars.TIKTOK_ADVERTISER_ID }}
          TIKTOK_ADS_LOOKBACK_DAYS: '30'
          TIKTOK_ADS_MAX_COMMENTS_PER_ADGROUP: '1000'
          TIKTOK_ADS_CONCURRENCY: '1'
          TIKTOK_ADS_REQUEST_DELAY_MS: '1000'
          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
          YOUTUBE_ADS_REFRESH_TOKEN: ${{ secrets.YOUTUBE_ADS_REFRESH_TOKEN }}
          GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ vars.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
          GOOGLE_ADS_CUSTOMER_IDS: ${{ vars.GOOGLE_ADS_CUSTOMER_IDS }}
          YOUTUBE_ADS_CHANNEL_ID: ${{ vars.YOUTUBE_ADS_CHANNEL_ID }}
          AD_CAMPAIGN_NAME_FILTER: ${{ vars.AD_CAMPAIGN_NAME_FILTER }}
          YOUTUBE_ADS_LOOKBACK_DAYS: '90'
