name: YouTube owner pending comment hide

on:
  workflow_dispatch:
  schedule:
    # 핵심 수집과 분리한 경량 DB-outbox 모더레이터. UTC 정각 데드존을 피하면서 15분 지연 상한을 유지한다.
    - cron: '7,22,37,52 * * * *'

concurrency:
  group: youtube-owner-pending-hide-production
  cancel-in-progress: false

jobs:
  moderate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Hide pending owned YouTube comments
        id: owner_pending_hide
        continue-on-error: true
        run: npm run hide:youtube-owner-pending
        env:
          GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          YOUTUBE_OWNER_BULK_HIDE_DRY_RUN: 'false'
          YOUTUBE_OWNER_BULK_HIDE_CONFIRM: HIDE_ALL_YOUTUBE_AD_ALERTS
          YOUTUBE_OWNER_ALERT_SCOPE: organic_satellite
          YOUTUBE_OWNER_BULK_HIDE_BATCH_SIZE: '50'
          YOUTUBE_OWNER_HIDE_VERIFY_ATTEMPTS: '5'
          YOUTUBE_OWNER_HIDE_VERIFY_DELAY_MS: '3000'
          YOUTUBE_OWNER_BULK_HIDE_ACTOR: youtube-owner-pending-auto-hide
      - name: Restore recent human false positives to public
        id: owner_fp_restore
        continue-on-error: true
        run: npm run restore:youtube-false-positives
        env:
          GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          YOUTUBE_FP_AUTO_RESTORE: AUTO_RESTORE_YOUTUBE_FALSE_POSITIVES
          # 과거 rejected 오탐도 3일 안에는 한 번 복원을 시도한다. 성공 미확인 행은
          # DB에 격리 표식을 남겨 이후 15분 회차의 반복 호출·경고를 막는다.
          YOUTUBE_FP_AUTO_RESTORE_LOOKBACK_HOURS: '72'
          YOUTUBE_FP_AUTO_RESTORE_MAX_ROWS: '100'
          YOUTUBE_RESTORE_VERIFY_ATTEMPTS: '5'
          YOUTUBE_RESTORE_VERIFY_DELAY_MS: '3000'
      - name: Record auxiliary outcome
        if: ${{ always() }}
        continue-on-error: true
        run: node src/record-auxiliary-outcome.js
        env:
          AUXILIARY_HEALTH_KEY: youtube_owner_pending_hide
          AUXILIARY_OUTCOME: ${{ steps.owner_pending_hide.outcome }}
          SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_ASSIGNEE_OTHER: ${{ vars.SLACK_ASSIGNEE_OTHER }}
          AUXILIARY_COMPONENT: YouTube 소유채널 15분 자동숨김
          AUXILIARY_REASON: pending owner moderation failed or made no progress
          AUXILIARY_FAILURE_THRESHOLD: '3'
          AUXILIARY_ALERT_COOLDOWN_HOURS: '24'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FAILURE_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - name: Record false-positive restore outcome
        if: ${{ always() }}
        continue-on-error: true
        run: node src/record-auxiliary-outcome.js
        env:
          AUXILIARY_HEALTH_KEY: youtube_owner_fp_restore
          AUXILIARY_OUTCOME: ${{ steps.owner_fp_restore.outcome }}
          SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_ASSIGNEE_OTHER: ${{ vars.SLACK_ASSIGNEE_OTHER }}
          AUXILIARY_COMPONENT: YouTube 오탐 댓글 자동 공개복원
          AUXILIARY_REASON: owner OAuth public restore failed or could not be verified
          AUXILIARY_FAILURE_THRESHOLD: '3'
          AUXILIARY_ALERT_COOLDOWN_HOURS: '24'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FAILURE_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - name: Write run summary
        if: ${{ always() }}
        run: |
          echo "### YouTube owner pending moderation" >> "$GITHUB_STEP_SUMMARY"
          echo "- moderation: ${{ steps.owner_pending_hide.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- false-positive public restore: ${{ steps.owner_fp_restore.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- core monitor impact: none" >> "$GITHUB_STEP_SUMMARY"
