name: YouTube owner comment ground truth

on:
  workflow_dispatch:
    inputs:
      alert_id:
        description: Supabase negative_comment_alerts row ID (never pass a comment ID)
        required: true
        type: string

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Audit one DB-backed YouTube comment without mutating it
        run: node src/youtube-owner-ground-truth.js
        env:
          GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          YOUTUBE_OWNER_AUDIT_ALERT_ID: ${{ inputs.alert_id }}
