name: YouTube owner-channel watchdog

on:
  workflow_dispatch:
  schedule:
    # 본 모니터(3시간 주기)의 정상 step 결과를 6시간마다 확인. UTC 00시 데드존을 피한다.
    - cron: '47 */6 * * *'

permissions:
  actions: write
  contents: read

concurrency:
  group: youtube-owner-channel-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: node src/youtube-owner-watchdog.js
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID }}
          SLACK_ASSIGNEE_OTHER: ${{ vars.SLACK_ASSIGNEE_OTHER }}
          YOUTUBE_OWNER_WATCHDOG_STALE_HOURS: '7'
