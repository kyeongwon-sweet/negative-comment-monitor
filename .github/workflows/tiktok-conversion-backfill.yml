name: TikTok conversion comment August backfill
run-name: TikTok conversion August (${{ inputs.dry_run && 'dry-run' || 'hide' }})

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 읽기전용이면 true. 실제 숨김은 false.
        required: true
        default: true
        type: boolean
      confirmation:
        description: 실제 숨김 시 HIDE_TIKTOK_CONVERSION_AUGUST_2026
        required: false
        type: string
      export_public_key_b64:
        description: 결과 암호화용 RSA 공개키(base64 PEM)
        required: true
        type: string

concurrency:
  group: tiktok-conversion-august-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: npm install --ignore-scripts
      - name: Classify and optionally hide August conversion comments
        run: node scripts/tiktok-conversion-backfill.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: claude-haiku-4-5-20251001
          SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_ASSIGNEE_OTHER: ${{ vars.SLACK_ASSIGNEE_OTHER }}
          SLACK_ASSIGNEE_AWARENESS: ${{ vars.SLACK_ASSIGNEE_AWARENESS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          TIKTOK_ADVERTISER_ID: ${{ vars.TIKTOK_ADVERTISER_ID }}
          TIKTOK_ADS_PRODUCT_NAME: JD
          TIKTOK_ADS_CHANNEL_CATEGORY: 인지 광고
          TIKTOK_ADS_CONCURRENCY: '5'
          TIKTOK_ADS_REQUEST_DELAY_MS: '250'
          TIKTOK_CONVERSION_DRY_RUN: ${{ inputs.dry_run }}
          TIKTOK_CONVERSION_HIDE_CONFIRM: ${{ inputs.confirmation }}
          TIKTOK_CONVERSION_EXPORT_PUBLIC_KEY_B64: ${{ inputs.export_public_key_b64 }}
          TIKTOK_CONVERSION_EXPORT_PATH: outputs/tiktok-conversion-2026-08.enc.json
      - name: Upload encrypted result only
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-conversion-august-${{ github.run_id }}
          path: outputs/tiktok-conversion-2026-08.enc.json
          if-no-files-found: error
          retention-days: 1
