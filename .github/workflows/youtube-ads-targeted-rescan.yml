name: YouTube ad targeted re-scan + auto-hide
run-name: YouTube ad re-scan (${{ inputs.target_video_ids }})

# 특정 광고 영상만 새 분류기로 재스캔해 새로 잡힌 부정댓글을 Slack에 알리고
# 소유 채널 OAuth로 자동 숨김한다. 분류기 감도 변경 후 특정 영상의 누락분을
# 정식 경로(알림→자동숨김)로 처리·검증하는 용도.

on:
  workflow_dispatch:
    inputs:
      target_video_ids:
        description: 재스캔할 YouTube 영상 ID(쉼표 구분). 비우면 전체 매칭 캠페인.
        required: true
      lookback_days:
        description: Lookback days (7-90)
        required: true
        type: choice
        options: ['7', '14', '30', '90']
        default: '30'
      auto_hide:
        description: 새로 잡힌 부정댓글을 소유 채널 OAuth로 자동 숨길지
        required: true
        type: choice
        options: ['true', 'false']
        default: 'true'

concurrency:
  group: youtube-ad-comment-alert-backfill
  cancel-in-progress: false

jobs:
  rescan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: npm install --ignore-scripts
      - name: Re-scan targeted YouTube awareness-ad videos
        run: node src/youtube-ads-run.js
        env:
          LLM_PROVIDER: gemini
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.1-flash-lite
          GEMINI_REQUEST_INTERVAL_MS: '1500'
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: claude-haiku-4-5-20251001
          SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_ASSIGNEE_OTHER: ${{ vars.SLACK_ASSIGNEE_OTHER }}
          SLACK_ASSIGNEE_JDBOK: ${{ vars.SLACK_ASSIGNEE_JDBOK }}
          SLACK_ASSIGNEE_AWARENESS: ${{ vars.SLACK_ASSIGNEE_AWARENESS }}
          SLACK_ROUTING_EFFECTIVE_DATE_KST: ${{ vars.SLACK_ROUTING_EFFECTIVE_DATE_KST }}
          SLACK_ASSIGNEE_AWARENESS_NEXT: ${{ vars.SLACK_ASSIGNEE_AWARENESS_NEXT }}
          SLACK_ASSIGNEE_P_SPONSORSHIP: ${{ vars.SLACK_ASSIGNEE_P_SPONSORSHIP }}
          SLACK_ASSIGNEE_P_VIRAL_VIDEO: ${{ vars.SLACK_ASSIGNEE_P_VIRAL_VIDEO }}
          SLACK_ASSIGNEE_JG_PRIMARY: ${{ vars.SLACK_ASSIGNEE_JG_PRIMARY }}
          SLACK_ASSIGNEE_JG_ADDITIONAL: ${{ vars.SLACK_ASSIGNEE_JG_ADDITIONAL }}
          META_AD_VIDEO_ASSIGNEES: ${{ vars.META_AD_VIDEO_ASSIGNEES }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
          YOUTUBE_ADS_REFRESH_TOKEN: ${{ secrets.YOUTUBE_ADS_REFRESH_TOKEN }}
          GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ vars.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
          YOUTUBE_ADS_CHANNEL_ID: ${{ vars.YOUTUBE_ADS_CHANNEL_ID }}
          AD_CAMPAIGN_NAME_FILTER: ${{ vars.AD_CAMPAIGN_NAME_FILTER }}
          YOUTUBE_ADS_PRODUCT_NAME: JD
          YOUTUBE_ADS_CHANNEL_CATEGORY: 인지 광고
          YOUTUBE_ADS_TARGET_VIDEO_IDS: ${{ inputs.target_video_ids }}
          YOUTUBE_ADS_LOOKBACK_DAYS: ${{ inputs.lookback_days }}
          YOUTUBE_ADS_MAX_THREAD_PAGES: '100'
          YOUTUBE_ADS_ALERT_AFTER: ''
          YOUTUBE_ADS_ALERT_DELAY_MS: '1200'
          YOUTUBE_ADS_SLACK_RETRIES: '6'
          YOUTUBE_ADS_FORCE: 'true'
          YOUTUBE_OWNER_AUTO_HIDE: ${{ inputs.auto_hide }}
          DRY_RUN: 'false'
      - name: Notify Slack on failure
        if: ${{ failure() }}
        continue-on-error: true
        run: node src/notify-failure.js
        env:
          SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_ASSIGNEE_OTHER: ${{ vars.SLACK_ASSIGNEE_OTHER }}
          FAILURE_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
