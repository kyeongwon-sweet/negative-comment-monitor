name: Google OAuth refresh exchange

on:
  workflow_dispatch:
    inputs:
      target:
        description: Refresh token destination
        required: true
        type: choice
        options:
          - google_ads
          - youtube_ads

jobs:
  exchange:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Exchange one-time code into short-lived secure handoff
        run: node src/google-oauth-refresh-exchange.js
        env:
          GOOGLE_OAUTH_TARGET: ${{ inputs.target }}
          GOOGLE_OAUTH_AUTH_CODE: ${{ secrets.GOOGLE_OAUTH_AUTH_CODE }}
          GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_OAUTH_REDIRECT_URI: http://127.0.0.1:53682
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
