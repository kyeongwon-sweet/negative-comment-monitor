name: TikTok ad comment alert backfill
run-name: TikTok ad comment alert backfill (${{ inputs.lookback_days }}d)

on:
  workflow_dispatch:
    inputs:
      lookback_days:
        description: Lookback days to publish (7-30)
        required: true
        type: choice
        options: ['7', '14', '30']
        default: '30'

concurrency:
  group: tiktok-ad-comment-alert-backfill
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: npm install --ignore-scripts
      - name: Publish and hide unseen TikTok awareness-ad negatives
        run: node src/tiktok-ads-run.js
        env:
          LLM_PROVIDER: gemini
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.1-flash-lite
          # 무료 티어 429로 문맥 후보가 보류되지 않도록 12 RPM 이하로 제한한다.
          GEMINI_REQUEST_INTERVAL_MS: '5000'
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: claude-haiku-4-5-20251001
          SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_ASSIGNEE_OTHER: ${{ vars.SLACK_ASSIGNEE_OTHER }}
          SLACK_ASSIGNEE_JDBOK: ${{ vars.SLACK_ASSIGNEE_JDBOK }}
          SLACK_ASSIGNEE_AWARENESS: ${{ vars.SLACK_ASSIGNEE_AWARENESS }}
          SLACK_ROUTING_EFFECTIVE_DATE_KST: ${{ vars.SLACK_ROUTING_EFFECTIVE_DATE_KST }}
          SLACK_ASSIGNEE_AWARENESS_NEXT: ${{ vars.SLACK_ASSIGNEE_AWARENESS_NEXT }}
          SLACK_ASSIGNEE_P_SPONSORSHIP: ${{ vars.SLACK_ASSIGNEE_P_SPONSORSHIP }}
          SLACK_ASSIGNEE_P_VIRAL_VIDEO: ${{ vars.SLACK_ASSIGNEE_P_VIRAL_VIDEO }}
          META_AD_VIDEO_ASSIGNEES: ${{ vars.META_AD_VIDEO_ASSIGNEES }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TIKTOK_APP_ID: ${{ vars.TIKTOK_APP_ID }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          TIKTOK_ADVERTISER_ID: ${{ vars.TIKTOK_ADVERTISER_ID }}
          AD_CAMPAIGN_NAME_FILTER: ${{ vars.AD_CAMPAIGN_NAME_FILTER }}
          TIKTOK_ADS_PRODUCT_NAME: JD
          TIKTOK_ADS_CHANNEL_CATEGORY: 인지 광고
          TIKTOK_ADS_LOOKBACK_DAYS: ${{ inputs.lookback_days }}
          TIKTOK_ADS_MAX_COMMENTS_PER_ADGROUP: '1000'
          TIKTOK_ADS_CONCURRENCY: '5'
          TIKTOK_ADS_REQUEST_DELAY_MS: '250'
          TIKTOK_ADS_ALERT_DELAY_MS: '1200'
          TIKTOK_ADS_ALERT_AFTER: ''
          TIKTOK_ADS_FORCE: 'true'
          TIKTOK_ADS_AUTO_HIDE: 'true'
          DRY_RUN: 'false'
      - name: Notify Slack on failure
        if: ${{ failure() }}
        continue-on-error: true
        run: node src/notify-failure.js
        env:
          SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_ASSIGNEE_OTHER: ${{ vars.SLACK_ASSIGNEE_OTHER }}
          FAILURE_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
