name: Monitor heartbeat

# monitor.yml의 아침 운영 기준과 최근 24시간 최대 실행 공백을 함께 확인한다.
# 고빈도 GitHub 크론이 조용히 드롭돼도 3.5시간 넘는 공백을 수치·구간과 함께 알린다.
on:
  workflow_dispatch:
    inputs:
      max_gap_minutes:
        description: Maximum allowed monitor gap (minutes); lower only for an alert-path test
        required: false
        type: number
        default: 210
  schedule:
    - cron: '0 5 * * *'   # 14:00 KST — 09:10 이후 충분한 버퍼
    - cron: '0 8 * * *'   # 17:00 KST — 첫 체크가 지연/드롭됐을 때 백업

permissions:
  actions: write
  contents: read

concurrency:
  group: negative-comment-monitor-heartbeat
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: node src/heartbeat-check.js
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          HEARTBEAT_MAX_GAP_MINUTES: ${{ inputs.max_gap_minutes || '210' }}
          HEARTBEAT_ALERT_COOLDOWN_HOURS: '24'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID }}
          SLACK_ASSIGNEE_OTHER: ${{ vars.SLACK_ASSIGNEE_OTHER }}
          SLACK_ASSIGNEE_JD_PRIMARY: ${{ vars.SLACK_ASSIGNEE_JD_PRIMARY }}
