name: Negative comment monitor
run-name: Negative comment monitor (${{ github.event_name }})

on:
  workflow_dispatch:
    inputs:
      verify_anthropic:
        description: Verify Anthropic API key before monitoring
        required: false
        type: boolean
        default: false
  schedule:
    # ⚠️ 아침 배치가 UTC 0시(=KST 09시) '데드존'에만 걸려 있으면 GitHub가 그 시각 크론을 대량
    # 드롭할 때 아침 스캔이 통째로 미발화한다(실측: 08-13 09시대 크론 4개 전부 드롭 → 인지 광고·
    # 일일 스캔 모두 누락). → 데드존을 앞뒤로 브래킷한다.
    # (1) 데드존 앞(UTC 23:30/23:50 = KST 08:30/08:50): 인지 광고 아침 배치(window KST 8~11)를
    #     데드존 전에 확정 발화. 멱등이라 뒤 회차와 중복 알림 없음.
    - cron: '30,50 23 * * *'
    # (2) 데드존 구간(UTC 00:13~00:52 = KST 09:13~09:52): 정시대 아침 일일 스캔, best-effort.
    - cron: '13,26,39,52 0 * * *'
    # (3) 데드존 뒤(UTC 01:08/01:23 = KST 10:08/10:23): (2)가 드롭돼도 09:10 마감 지난 첫 실행이
    #     오전 안에 반드시 걸리게 하는 백업. schedule.js가 그날 미수집이면 1회 처리(멱등).
    - cron: '8,23 1 * * *'
    # Floor scan: even in quiet periods, run the full monitor every 3h so first-negative latency is bounded.
    - cron: '0 */3 * * *'
    # 상시 15분 웨이크: 부정 감지글 3h 집중확인 + 지연분 백업.
    - cron: '*/15 * * * *'

concurrency:
  group: negative-comment-monitor-production
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Gate 15-minute intensive run
        id: intensive_gate
        if: ${{ github.event_name == 'schedule' && github.event.schedule == '*/15 * * * *' }}
        run: node src/intensive-gate.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - run: npm install --ignore-scripts
        if: ${{ github.event_name != 'schedule' || github.event.schedule != '*/15 * * * *' || steps.intensive_gate.outputs.should_run == 'true' }}
      - name: Verify Anthropic API key
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_anthropic }}
        run: node src/verify-anthropic.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: claude-haiku-4-5-20251001
      - run: npm start
        if: ${{ github.event_name != 'schedule' || github.event.schedule != '*/15 * * * *' || steps.intensive_gate.outputs.should_run == 'true' }}
        env:
          GAS_WEB_APP_URL: ${{ secrets.GAS_WEB_APP_URL }}
          GAS_VERIFY_TOKEN: ${{ secrets.GAS_VERIFY_TOKEN }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          # 청크별 timeout 안전망. TikTok은 아래 50개 청킹으로 단일 대형 actor run을 방지한다.
          APIFY_RUN_TIMEOUT_MS: ${{ vars.APIFY_RUN_TIMEOUT_MS }}
          APIFY_TIKTOK_BATCH_SIZE: '50'
          PLATFORM_FAILURE_THRESHOLD: '3'
          PLATFORM_FAILURE_ALERT_COOLDOWN_HOURS: '12'
          LLM_PROVIDER: gemini
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.1-flash-lite
          GEMINI_REQUEST_INTERVAL_MS: '1500'
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: claude-haiku-4-5-20251001
          SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_SIGNING_SECRET: ${{ secrets.SLACK_SIGNING_SECRET }}
          SLACK_ASSIGNEE_SATELLITE: ${{ vars.SLACK_ASSIGNEE_SATELLITE }}
          SLACK_ASSIGNEE_VIRAL_BANNER: ${{ vars.SLACK_ASSIGNEE_VIRAL_BANNER }}
          SLACK_ASSIGNEE_VIRAL_VIDEO_OWNED: ${{ vars.SLACK_ASSIGNEE_VIRAL_VIDEO_OWNED }}
          SLACK_ASSIGNEE_OTHER: ${{ vars.SLACK_ASSIGNEE_OTHER }}
          SLACK_ASSIGNEE_JDBOK: ${{ vars.SLACK_ASSIGNEE_JDBOK }}
          SLACK_ASSIGNEE_AWARENESS: ${{ vars.SLACK_ASSIGNEE_AWARENESS }}
          SLACK_ROUTING_EFFECTIVE_DATE_KST: ${{ vars.SLACK_ROUTING_EFFECTIVE_DATE_KST }}
          SLACK_ASSIGNEE_AWARENESS_NEXT: ${{ vars.SLACK_ASSIGNEE_AWARENESS_NEXT }}
          SLACK_ASSIGNEE_SPONSORSHIP: ${{ vars.SLACK_ASSIGNEE_SPONSORSHIP }}
          SLACK_ASSIGNEE_JD_POWER_CHANNEL: ${{ vars.SLACK_ASSIGNEE_JD_POWER_CHANNEL }}
          SLACK_ASSIGNEE_JD_SPONSORSHIP: ${{ vars.SLACK_ASSIGNEE_JD_SPONSORSHIP }}
          SLACK_ASSIGNEE_JD_VIRAL_BANNER: ${{ vars.SLACK_ASSIGNEE_JD_VIRAL_BANNER }}
          SLACK_ASSIGNEE_JD_VIRAL_VIDEO: ${{ vars.SLACK_ASSIGNEE_JD_VIRAL_VIDEO }}
          SLACK_ASSIGNEE_JD_SATELLITE: ${{ vars.SLACK_ASSIGNEE_JD_SATELLITE }}
          SLACK_ASSIGNEE_JD_SPONSORSHIP_NEXT: ${{ vars.SLACK_ASSIGNEE_JD_SPONSORSHIP_NEXT }}
          SLACK_ASSIGNEE_JD_VIRAL_BANNER_NEXT: ${{ vars.SLACK_ASSIGNEE_JD_VIRAL_BANNER_NEXT }}
          SLACK_ASSIGNEE_JD_VIRAL_VIDEO_NEXT: ${{ vars.SLACK_ASSIGNEE_JD_VIRAL_VIDEO_NEXT }}
          SLACK_ASSIGNEE_JD_SATELLITE_NEXT: ${{ vars.SLACK_ASSIGNEE_JD_SATELLITE_NEXT }}
          SLACK_ASSIGNEE_P_VIRAL_BANNER: ${{ vars.SLACK_ASSIGNEE_P_VIRAL_BANNER }}
          SLACK_ASSIGNEE_P_VIRAL_VIDEO: ${{ vars.SLACK_ASSIGNEE_P_VIRAL_VIDEO }}
          SLACK_ASSIGNEE_P_POWER_CHANNEL: ${{ vars.SLACK_ASSIGNEE_P_POWER_CHANNEL }}
          SLACK_ASSIGNEE_P_SPONSORSHIP: ${{ vars.SLACK_ASSIGNEE_P_SPONSORSHIP }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          YOUTUBE_SATELLITE_AUTO_HIDE: 'true'
          APIFY_INSTAGRAM_ACTOR_ID: ${{ vars.APIFY_INSTAGRAM_ACTOR_ID }}
          APIFY_YOUTUBE_ACTOR_ID: ${{ vars.APIFY_YOUTUBE_ACTOR_ID }}
          APIFY_TIKTOK_ACTOR_ID: ${{ vars.APIFY_TIKTOK_ACTOR_ID }}
          APIFY_TWITTER_ACTOR_ID: ${{ vars.APIFY_TWITTER_ACTOR_ID }}
          APIFY_INSTAGRAM_INPUT_JSON: ${{ vars.APIFY_INSTAGRAM_INPUT_JSON }}
          APIFY_YOUTUBE_INPUT_JSON: ${{ vars.APIFY_YOUTUBE_INPUT_JSON }}
          APIFY_TIKTOK_INPUT_JSON: ${{ vars.APIFY_TIKTOK_INPUT_JSON }}
          APIFY_TWITTER_INPUT_JSON: ${{ vars.APIFY_TWITTER_INPUT_JSON }}
          SOURCE_SPREADSHEET_ID: ${{ vars.SOURCE_SPREADSHEET_ID }}
          SOURCE_SHEET_NAME: ${{ vars.SOURCE_SHEET_NAME }}
          EXCLUDED_CHANNEL_CATEGORY: ${{ vars.EXCLUDED_CHANNEL_CATEGORY }}
          MANAGED_CHANNEL_CATEGORIES: ${{ vars.MANAGED_CHANNEL_CATEGORIES }}
          TARGET_BATCH_SIZE: ${{ vars.TARGET_BATCH_SIZE }}
          GAS_FETCH_RETRIES: ${{ vars.GAS_FETCH_RETRIES }}
          FIRST_SCAN_LIMIT: ${{ vars.FIRST_SCAN_LIMIT }}
          NO_SIGNAL_SCAN_LIMIT: ${{ vars.NO_SIGNAL_SCAN_LIMIT }}
          DEEP_SCAN_LIMIT: ${{ vars.DEEP_SCAN_LIMIT }}
          DEEP_SCAN_COMMENT_THRESHOLD: ${{ vars.DEEP_SCAN_COMMENT_THRESHOLD }}
          DEEP_SCAN_RECENT_COMMENT_THRESHOLD: ${{ vars.DEEP_SCAN_RECENT_COMMENT_THRESHOLD }}
          DEEP_SCAN_COMMENT_LIMIT: ${{ vars.DEEP_SCAN_COMMENT_LIMIT }}
          TRACKING_DAYS: ${{ vars.TRACKING_DAYS }}
          DELTA_ENABLED: 'true'
          DRY_RUN: 'false'
      - name: Poll Meta awareness ad comments (webhook fallback)
        # Meta Webhook의 Advanced Access/구독이 끊겨도 광고 댓글을 놓치지 않도록
        # Marketing API로 최근 공개 광고 댓글만 1시간에 한 번 보완 수집한다.
        continue-on-error: true
        run: node src/meta-ads-poll.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          META_GRAPH_BASE: https://graph.facebook.com/v26.0
          META_TOKEN_KIND: ig_ads
          META_AD_ACCOUNT_ID: act_550617335901928
          META_ADS_POLL_INTERVAL_MINUTES: '60'
          META_ADS_POLL_LOOKBACK_HOURS: '72'
          META_ADS_POLL_MAX_PAGES: '3'
          META_ADS_POLL_CONCURRENCY: '8'
          META_ADS_POLL_FORCE: ${{ github.event_name == 'workflow_dispatch' }}
      - name: Process queued Meta Instagram ad comments
        # 인지 광고 부정댓글은 '아침 배치'로만 발송(부정댓글 관리 시간 정렬). 웹훅은 하루 종일 큐에 쌓임.
        # ⚠️ 특정 아침 크론(13,26,39,52)에만 걸면 GitHub이 그 크론을 드롭할 때 배치가 통째로 누락된다(실측 사고).
        # → always()로 모든 웨이크(주로 안정적인 */15)에서 실행하되, meta-ads-run.js가 KST 9시대에만 실제
        #   동작하도록 자체 게이트(inMorningWindow). 아침대 15분 웨이크 4회가 재시도 역할 = 자가치유.
        #   workflow_dispatch는 META_ADS_FORCE로 시간 무관 강제 실행.
        if: ${{ always() }}
        run: node src/meta-ads-run.js
        env:
          LLM_PROVIDER: gemini
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.1-flash-lite
          GEMINI_REQUEST_INTERVAL_MS: '1500'
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: claude-haiku-4-5-20251001
          SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_ASSIGNEE_OTHER: ${{ vars.SLACK_ASSIGNEE_OTHER }}
          SLACK_ASSIGNEE_JDBOK: ${{ vars.SLACK_ASSIGNEE_JDBOK }}
          SLACK_ASSIGNEE_AWARENESS: ${{ vars.SLACK_ASSIGNEE_AWARENESS }}
          SLACK_ROUTING_EFFECTIVE_DATE_KST: ${{ vars.SLACK_ROUTING_EFFECTIVE_DATE_KST }}
          SLACK_ASSIGNEE_AWARENESS_NEXT: ${{ vars.SLACK_ASSIGNEE_AWARENESS_NEXT }}
          SLACK_ASSIGNEE_P_SPONSORSHIP: ${{ vars.SLACK_ASSIGNEE_P_SPONSORSHIP }}
          SLACK_ASSIGNEE_P_VIRAL_VIDEO: ${{ vars.SLACK_ASSIGNEE_P_VIRAL_VIDEO }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          META_GRAPH_BASE: https://graph.facebook.com/v26.0
          META_TOKEN_KIND: ig_ads
          META_ADS_PRODUCT_NAME: JD
          META_ADS_CHANNEL_CATEGORY: 인지 광고
          META_ADS_INSTAGRAM_USERNAME: lalasweet_icecream
          META_AD_VIDEO_ASSIGNEES: ${{ vars.META_AD_VIDEO_ASSIGNEES }}
          META_AUTO_HIDE_EXCLUDED_IG_USER_IDS: ${{ vars.META_AUTO_HIDE_EXCLUDED_IG_USER_IDS }}
          # 아침 배치 창(KST 8~11시). ⚠️ KST 9시(UTC0)는 GitHub 크론 대량 드롭 구간이라 단일 9시 게이트
          # 금지 — 앞뒤로 넓혀 실제 도는 웨이크(UTC 23/1/2)를 타게 한다. 수동 실행은 FORCE로 시간 무관.
          META_ADS_WINDOW_START: '8'
          META_ADS_WINDOW_END: '11'
          META_ADS_FORCE: ${{ github.event_name == 'workflow_dispatch' }}
          META_ADS_AUTO_HIDE: 'true'
          DRY_RUN: 'false'
      - name: Poll TikTok awareness ad comments
        # TikTok Marketing API는 웹훅 대신 폴링. Meta와 같은 KST 8~11 자가치유 창을 사용한다.
        # 캠페인명에 AD_CAMPAIGN_NAME_FILTER(기본 '빙과')가 포함된 광고만 수집한다.
        if: ${{ always() }}
        run: node src/tiktok-ads-run.js
        env:
          LLM_PROVIDER: gemini
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.1-flash-lite
          GEMINI_REQUEST_INTERVAL_MS: '1500'
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: claude-haiku-4-5-20251001
          SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_ASSIGNEE_OTHER: ${{ vars.SLACK_ASSIGNEE_OTHER }}
          SLACK_ASSIGNEE_JDBOK: ${{ vars.SLACK_ASSIGNEE_JDBOK }}
          SLACK_ASSIGNEE_AWARENESS: ${{ vars.SLACK_ASSIGNEE_AWARENESS }}
          SLACK_ROUTING_EFFECTIVE_DATE_KST: ${{ vars.SLACK_ROUTING_EFFECTIVE_DATE_KST }}
          SLACK_ASSIGNEE_AWARENESS_NEXT: ${{ vars.SLACK_ASSIGNEE_AWARENESS_NEXT }}
          SLACK_ASSIGNEE_P_SPONSORSHIP: ${{ vars.SLACK_ASSIGNEE_P_SPONSORSHIP }}
          SLACK_ASSIGNEE_P_VIRAL_VIDEO: ${{ vars.SLACK_ASSIGNEE_P_VIRAL_VIDEO }}
          META_AD_VIDEO_ASSIGNEES: ${{ vars.META_AD_VIDEO_ASSIGNEES }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TIKTOK_APP_ID: ${{ vars.TIKTOK_APP_ID }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          TIKTOK_ADVERTISER_ID: ${{ vars.TIKTOK_ADVERTISER_ID }}
          AD_CAMPAIGN_NAME_FILTER: ${{ vars.AD_CAMPAIGN_NAME_FILTER }}
          TIKTOK_ADS_PRODUCT_NAME: JD
          TIKTOK_ADS_CHANNEL_CATEGORY: 인지 광고
          TIKTOK_ADS_LOOKBACK_DAYS: '7'
          TIKTOK_ADS_ALERT_AFTER: ${{ vars.TIKTOK_ADS_ALERT_AFTER }}
          TIKTOK_ADS_MAX_COMMENTS_PER_ADGROUP: '100'
          TIKTOK_ADS_CONCURRENCY: '1'
          TIKTOK_ADS_REQUEST_DELAY_MS: '1000'
          TIKTOK_ADS_WINDOW_START: '8'
          TIKTOK_ADS_WINDOW_END: '11'
          TIKTOK_ADS_FORCE: ${{ github.event_name == 'workflow_dispatch' }}
          TIKTOK_ADS_AUTO_HIDE: 'true'
          DRY_RUN: 'false'
      - name: Poll YouTube awareness ad comments
        id: youtube_ads
        # Google Ads 관리자 산하 활성 일반 계정에서 설정 키워드가 포함된 캠페인 영상을 찾고,
        # 채널 OAuth로 조회 가능한 광고 영상 댓글과 답글을 읽는다. KST 하루 1회 멱등 실행.
        if: ${{ always() }}
        continue-on-error: true
        run: node src/youtube-ads-run.js
        env:
          LLM_PROVIDER: gemini
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.1-flash-lite
          GEMINI_REQUEST_INTERVAL_MS: '1500'
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: claude-haiku-4-5-20251001
          SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_ASSIGNEE_OTHER: ${{ vars.SLACK_ASSIGNEE_OTHER }}
          SLACK_ASSIGNEE_JDBOK: ${{ vars.SLACK_ASSIGNEE_JDBOK }}
          SLACK_ASSIGNEE_AWARENESS: ${{ vars.SLACK_ASSIGNEE_AWARENESS }}
          SLACK_ROUTING_EFFECTIVE_DATE_KST: ${{ vars.SLACK_ROUTING_EFFECTIVE_DATE_KST }}
          SLACK_ASSIGNEE_AWARENESS_NEXT: ${{ vars.SLACK_ASSIGNEE_AWARENESS_NEXT }}
          SLACK_ASSIGNEE_P_SPONSORSHIP: ${{ vars.SLACK_ASSIGNEE_P_SPONSORSHIP }}
          SLACK_ASSIGNEE_P_VIRAL_VIDEO: ${{ vars.SLACK_ASSIGNEE_P_VIRAL_VIDEO }}
          META_AD_VIDEO_ASSIGNEES: ${{ vars.META_AD_VIDEO_ASSIGNEES }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
          YOUTUBE_ADS_REFRESH_TOKEN: ${{ secrets.YOUTUBE_ADS_REFRESH_TOKEN }}
          GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ vars.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
          YOUTUBE_ADS_CHANNEL_ID: ${{ vars.YOUTUBE_ADS_CHANNEL_ID }}
          AD_CAMPAIGN_NAME_FILTER: ${{ vars.AD_CAMPAIGN_NAME_FILTER }}
          YOUTUBE_ADS_PRODUCT_NAME: JD
          YOUTUBE_ADS_CHANNEL_CATEGORY: 인지 광고
          YOUTUBE_ADS_LOOKBACK_DAYS: '14'
          YOUTUBE_ADS_MAX_THREAD_PAGES: '10'
          YOUTUBE_ADS_MAX_REPLY_PAGES: '100'
          YOUTUBE_ADS_DEEP_MAX_THREAD_PAGES: '100'
          YOUTUBE_ADS_HIGH_COMMENT_THRESHOLD: '200'
          YOUTUBE_ADS_ALERT_AFTER: ${{ vars.YOUTUBE_ADS_ALERT_AFTER }}
          YOUTUBE_ADS_WINDOW_START: '8'
          YOUTUBE_ADS_WINDOW_END: '11'
          YOUTUBE_ADS_FORCE: ${{ github.event_name == 'workflow_dispatch' }}
          YOUTUBE_OWNER_AUTO_HIDE: 'true'
          DRY_RUN: 'false'
      - name: Record YouTube Ads auxiliary outcome
        if: ${{ always() }}
        continue-on-error: true
        run: node src/record-auxiliary-outcome.js
        env:
          AUXILIARY_HEALTH_KEY: youtube_ads
          AUXILIARY_OUTCOME: ${{ steps.youtube_ads.outcome }}
          AUXILIARY_COMPONENT: YouTube 인지광고 수집
          AUXILIARY_REASON: Google Ads 또는 YouTube OAuth/API 단계 실패
          AUXILIARY_FAILURE_THRESHOLD: '3'
          AUXILIARY_ALERT_COOLDOWN_HOURS: '24'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_ASSIGNEE_OTHER: ${{ vars.SLACK_ASSIGNEE_OTHER }}
          FAILURE_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - name: Sync new negative comments to Google Sheet
        if: ${{ always() }}
        continue-on-error: true
        run: npm run sync:negative-comment-sheet
        env:
          NEGATIVE_COMMENT_SHEET_WEBHOOK_URL: ${{ secrets.NEGATIVE_COMMENT_SHEET_WEBHOOK_URL }}
          NEGATIVE_COMMENT_SHEET_WEBHOOK_TOKEN: ${{ secrets.NEGATIVE_COMMENT_SHEET_WEBHOOK_TOKEN }}
          NEGATIVE_COMMENT_SHEET_FAILURE_THRESHOLD: '3'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_ASSIGNEE_OTHER: ${{ vars.SLACK_ASSIGNEE_OTHER }}
      - name: Notify Slack on failure
        if: ${{ failure() }}
        continue-on-error: true
        run: node src/notify-failure.js
        env:
          SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_ASSIGNEE_OTHER: ${{ vars.SLACK_ASSIGNEE_OTHER }}
          FAILURE_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
